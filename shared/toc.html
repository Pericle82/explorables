<style>
/* xpl:toc — barra delle sezioni + pannello «Indice» (versione 2) */
nav.toc.xpl-ready{overflow:visible}
nav.toc.xpl-ready .in{display:flex;align-items:center;gap:8px;min-width:0}
.xpl-strip{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);padding-inline:6px}
.xpl-strip::-webkit-scrollbar{display:none}
.xpl-strip a{flex-shrink:0}
.xpl-toc-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.76rem;color:var(--ink);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);flex-shrink:0;white-space:nowrap}
.xpl-toc-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.xpl-toc-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.xpl-toc-btn .pos{color:var(--muted);font-size:.7rem}
.xpl-toc-btn[aria-expanded="true"] .pos{color:inherit;opacity:.8}
.xpl-toc{position:fixed;right:max(12px,calc((100vw - 980px)/2));top:var(--xpl-top,56px);width:min(400px,calc(100vw - 24px));max-height:calc(100dvh - var(--xpl-top,56px) - 16px);z-index:950;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.xpl-toc[hidden]{display:none}
.xpl-toc-head{display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.xpl-toc-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xpl-toc-row span{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.xpl-toc-row small{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:0;text-transform:none}
.xpl-toc-tools{display:flex;gap:6px}
.xpl-toc-tools button{all:unset;cursor:pointer;font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:6px}
.xpl-toc-tools button:hover{color:var(--ink);border-color:var(--accent)}
.xpl-toc-tools button:focus-visible{outline:2px solid var(--accent)}
.xpl-toc-q{font:inherit;font-size:.88rem;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.xpl-toc-q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.xpl-toc-list{overflow-y:auto;padding:6px 6px 12px;overscroll-behavior:contain}
.xpl-part{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:12px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
.xpl-part:first-child{border-top:none;margin-top:0;padding-top:4px}
.xpl-grp{border-radius:8px}
.xpl-grp.open{background:var(--surface-2)}
.xpl-sec{display:grid;grid-template-columns:22px 1fr;align-items:start}
.xpl-tw{all:unset;cursor:pointer;width:22px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:6px;font-size:.7rem;transition:transform .15s}
.xpl-tw:hover{color:var(--ink)}
.xpl-tw:focus-visible{outline:2px solid var(--accent)}
.xpl-grp.open>.xpl-sec .xpl-tw{transform:rotate(90deg)}
.xpl-tw.none{visibility:hidden}
.xpl-sec a{display:block;text-decoration:none;color:var(--ink);font-family:var(--serif);font-weight:650;font-size:.92rem;line-height:1.3;padding:6px 8px 6px 2px;border-radius:6px}
.xpl-sec a small{display:block;font-family:var(--mono);font-weight:400;font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.xpl-subs{display:none;padding:0 6px 6px 22px}
.xpl-grp.open .xpl-subs{display:block}
.xpl-subs a{display:block;text-decoration:none;color:var(--muted);font-size:.84rem;line-height:1.35;padding:4px 8px;border-left:2px solid var(--line)}
.xpl-toc-list a:hover{color:var(--ink);background:var(--bg)}
.xpl-toc-list a.here{color:var(--ink);background:var(--accent-soft)}
.xpl-subs a.here{border-left-color:var(--accent)}
.xpl-toc-list a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.xpl-toc-list mark{background:var(--accent-soft);color:inherit;border-radius:2px}
.xpl-empty{padding:14px 10px;color:var(--muted);font-size:.86rem}
.xpl-toc-back{position:fixed;left:0;right:0;bottom:0;top:var(--xpl-top,56px);z-index:940;background:rgba(0,0,0,.18)}
.xpl-toc-back[hidden]{display:none}
body:has(.xpl-toc:not([hidden])) .xpl-nav{display:none}
@media (max-width:640px){.xpl-toc{right:8px;left:8px;width:auto}.xpl-toc-btn .pos{display:none}}
@media (prefers-reduced-motion: reduce){.xpl-tw{transition:none}.xpl-strip{scroll-behavior:auto}}
</style>
<script>
/* xpl:toc v2 — pannello «Indice» a gruppi comprimibili, con ricerca, ancorato sotto la barra delle sezioni */
(function(){
  if(document.querySelector(".xpl-toc"))return;
  const nav=document.querySelector("nav.toc");if(!nav)return;
  const inner=nav.querySelector(".in")||nav;
  const txt=el=>el?el.textContent.replace(/\s+/g," ").trim():"";
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const slug=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);
  // 1) barra: i link scorrono in una striscia, il pulsante resta fuori e non copre nulla
  inner.querySelectorAll("#tocBtn,.xpl-toc-btn").forEach(b=>b.remove());
  const strip=document.createElement("div");strip.className="xpl-strip";
  [...inner.children].forEach(ch=>{if(ch.tagName==="A")strip.appendChild(ch);});
  inner.prepend(strip);nav.classList.add("xpl-ready");
  // 2) struttura: parti (.part), sezioni (h2) e sottosezioni (h3 fuori da laboratori e schede)
  const root=document.querySelector("main")||document.querySelector(".wrap")||document.body;
  const groups=[];let part=null;
  root.querySelectorAll(".part, section").forEach(el=>{
    if(el.classList.contains("part")){const h=el.querySelector("h2");part={label:txt(el.querySelector(".part-label")),title:txt(h),el:h||el};if(h&&!h.id)h.id=slug(part.label||part.title);return;}
    if(el.parentElement&&el.parentElement.closest("section"))return;
    const h2=el.querySelector("h2");if(!h2)return;
    const eb=el.querySelector(".sec-head .eyebrow");const tgt=el.id?el:h2;if(!tgt.id)tgt.id=slug(txt(h2))||"sez";
    const subs=[];el.querySelectorAll("h3").forEach(h3=>{if(h3.closest(".lab,.lab-head,.card,.recap,.mn,.xpl-toc"))return;if(!h3.id)h3.id=tgt.id+"-"+slug(txt(h3));subs.push({el:h3,t:txt(h3)});});
    groups.push({el:tgt,t:txt(h2),k:eb?txt(eb).split("·").slice(0,2).join("·").trim():"",part,subs});
  });
  if(!groups.length)return;
  // 3) pulsante e pannello
  const btn=document.createElement("button");btn.type="button";btn.className="xpl-toc-btn";btn.setAttribute("aria-expanded","false");btn.setAttribute("aria-controls","xpl-toc");
  btn.innerHTML='<span aria-hidden="true">☰</span> Indice <span class="pos"></span>';inner.appendChild(btn);
  const panel=document.createElement("div");panel.className="xpl-toc";panel.id="xpl-toc";panel.hidden=true;panel.setAttribute("role","dialog");panel.setAttribute("aria-label","Indice della guida");
  panel.innerHTML='<div class="xpl-toc-head"><div class="xpl-toc-row"><span>Indice <small></small></span><div class="xpl-toc-tools"><button type="button" data-a="all">Espandi tutto</button><button type="button" data-a="none">Comprimi</button><button type="button" data-a="close" aria-label="Chiudi indice">✕</button></div></div><input class="xpl-toc-q" type="search" placeholder="Cerca un capitolo o un argomento…" aria-label="Cerca nell\'indice"></div><div class="xpl-toc-list"></div>';
  const back=document.createElement("div");back.className="xpl-toc-back";back.hidden=true;
  document.body.append(back,panel);
  const list=panel.querySelector(".xpl-toc-list"),q=panel.querySelector(".xpl-toc-q");
  let lastPart=null;const G=[];
  groups.forEach((g,i)=>{
    if(g.part&&g.part!==lastPart){lastPart=g.part;const p=document.createElement("div");p.className="xpl-part";p.textContent=(g.part.label?g.part.label+" · ":"")+g.part.title;list.appendChild(p);g.partEl=p;}
    const box=document.createElement("div");box.className="xpl-grp";
    box.innerHTML=`<div class="xpl-sec"><button type="button" class="xpl-tw${g.subs.length?"":" none"}" aria-label="Mostra le sottosezioni" aria-expanded="false" tabindex="${g.subs.length?0:-1}">▶</button><a href="#${g.el.id}">${g.k?`<small>${esc(g.k)}</small>`:""}${esc(g.t)}</a></div>`+(g.subs.length?`<div class="xpl-subs">${g.subs.map(s=>`<a href="#${s.el.id}">${esc(s.t)}</a>`).join("")}</div>`:"");
    list.appendChild(box);G.push({g,box,a:box.querySelector(".xpl-sec a"),subA:[...box.querySelectorAll(".xpl-subs a")],tw:box.querySelector(".xpl-tw")});
  });
  const setOpen=(x,o)=>{x.box.classList.toggle("open",o);x.tw.setAttribute("aria-expanded",o?"true":"false");};
  G.forEach(x=>x.tw.addEventListener("click",()=>setOpen(x,!x.box.classList.contains("open"))));
  // 4) apertura, chiusura, posizione sotto la barra
  function place(){const r=nav.getBoundingClientRect();document.documentElement.style.setProperty("--xpl-top",Math.max(8,Math.round(r.bottom)+6)+"px");}
  function open(o){if(o){place();q.value="";filter("");G.forEach(x=>setOpen(x,x===cur));}
    panel.hidden=!o;back.hidden=!o;btn.setAttribute("aria-expanded",o?"true":"false");
    if(o){const h=list.querySelector("a.here")||list.querySelector("a");h&&h.scrollIntoView({block:"center"});if(matchMedia("(hover: hover)").matches)q.focus({preventScroll:true});else{panel.tabIndex=-1;panel.focus({preventScroll:true});}}}
  btn.addEventListener("click",()=>open(panel.hidden));
  back.addEventListener("click",()=>open(false));
  panel.querySelector(".xpl-toc-tools").addEventListener("click",e=>{const a=e.target.closest("button");if(!a)return;
    if(a.dataset.a==="close"){open(false);btn.focus();}else G.forEach(x=>{if(x.g.subs.length)setOpen(x,a.dataset.a==="all");});});
  list.addEventListener("click",e=>{if(e.target.closest("a"))open(false);});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!panel.hidden){open(false);btn.focus();}});
  addEventListener("resize",()=>{if(!panel.hidden)place();});
  // 5) ricerca: filtra sezioni e sottosezioni, apre i gruppi che hanno corrispondenze
  function hl(a,t,s){const base=a.dataset.t||(a.dataset.t=a.lastChild.textContent);const i=t?base.toLowerCase().indexOf(t):-1;
    const small=a.querySelector("small");a.innerHTML=(small?small.outerHTML:"")+(i<0?esc(base):esc(base.slice(0,i))+"<mark>"+esc(base.slice(i,i+t.length))+"</mark>"+esc(base.slice(i+t.length)));}
  function filter(t){t=t.trim().toLowerCase();let n=0;
    G.forEach(x=>{const m1=x.g.t.toLowerCase().includes(t)||x.g.k.toLowerCase().includes(t);let any=false;
      x.subA.forEach((a,i)=>{const m=!t||x.g.subs[i].t.toLowerCase().includes(t);a.hidden=!m&&!m1;if(t&&m)any=true;hl(a,t);});
      const show=!t||m1||any;x.box.hidden=!show;if(show)n++;hl(x.a,t);if(t)setOpen(x,any);});
    list.querySelectorAll(".xpl-part").forEach(p=>{let s=p.nextElementSibling,vis=false;while(s&&!s.classList.contains("xpl-part")){if(!s.hidden)vis=true;s=s.nextElementSibling;}p.hidden=!vis;});
    let e=list.querySelector(".xpl-empty");if(!n){if(!e){e=document.createElement("p");e.className="xpl-empty";e.textContent="Nessuna voce corrisponde.";list.appendChild(e);}}else if(e)e.remove();}
  q.addEventListener("input",()=>filter(q.value));
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){const a=[...list.querySelectorAll("a")].find(a=>!a.hidden&&!a.closest("[hidden]"));if(a){a.click();location.hash=a.getAttribute("href");}}});
  // 6) posizione corrente: evidenzia la voce, aggiorna il contatore, tiene visibile il link attivo nella barra
  let cur=null,curSub=null;const total=G.length;
  panel.querySelector(".xpl-toc-row small").textContent=total+" sezioni";
  function spy(){let c=null,cs=null;for(const x of G){if(x.g.el.getBoundingClientRect().top<=120)c=x;else break;}
    if(c)for(let i=0;i<c.g.subs.length;i++){if(c.g.subs[i].el.getBoundingClientRect().top<=120)cs=c.subA[i];}
    if(c!==cur){cur&&cur.a.classList.remove("here");cur=c;cur&&cur.a.classList.add("here");btn.querySelector(".pos").textContent=cur?(G.indexOf(cur)+1)+"/"+total:"";}
    if(cs!==curSub){curSub&&curSub.classList.remove("here");curSub=cs;curSub&&curSub.classList.add("here");}
    const on=strip.querySelector("a.on");if(on){const sr=strip.getBoundingClientRect(),ar=on.getBoundingClientRect();if(ar.left<sr.left+10||ar.right>sr.right-24)strip.scrollLeft+=ar.left-sr.left-sr.width/3;}}
  addEventListener("scroll",spy,{passive:true});setTimeout(spy,60);
})();
</script>
