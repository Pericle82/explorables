<title>Manuale AI: i concetti dell’intelligenza artificiale, uno sopra l’altro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============ TEMA EXPLORABLES ============
   Token di colore: stessi nomi in tutte le guide. Ogni guida sceglie SOLO il proprio accento
   (--accent, --accent-soft) dalla palette in AUTHORING.md; tutto il resto resta identico. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#E7EAEF; --ink:#161B24; --muted:#565E6C;
  --line:#CDD2DA; --grid:#E0E4EA; --accent:#9C4A26; --accent-soft:#F4E0D6;
  --good:#2C7A4C; --good-soft:#D8EEDF; --bad:#B03838; --bad-soft:#F5DCDC; --warn:#9A6210; --warn-soft:#F3E5CC;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1218; --surface:#161B23; --surface-2:#1E2530; --ink:#E3E7EE; --muted:#97A0AE;
    --line:#2C3441; --grid:#232A35; --accent:#E59872; --accent-soft:#3C231A;
    --good:#62C98E; --good-soft:#18352A; --bad:#EE7B7B; --bad-soft:#3C1E1E; --warn:#E2AA4E; --warn-soft:#3A2D14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --surface:#161B23; --surface-2:#1E2530; --ink:#E3E7EE; --muted:#97A0AE;
  --line:#2C3441; --grid:#232A35; --accent:#E59872; --accent-soft:#3C231A;
  --good:#62C98E; --good-soft:#18352A; --bad:#EE7B7B; --bad-soft:#3C1E1E; --warn:#E2AA4E; --warn-soft:#3A2D14;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:20px;padding-block:0 64px}
.wrap{max-width:980px;margin:0 auto}
.prose{max-width:68ch}
h1,h2,h3{font-family:var(--serif);font-weight:650;text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3.4vw,2.2rem)}
h3{font-size:1.2rem;font-weight:500}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
code,.k{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
abbr{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.hero{padding-block:48px 28px;display:flex;flex-direction:column;gap:16px}
.lede{font-size:1.1rem;max-width:62ch}

/* nav */
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-20px;padding:10px 20px;overflow-x:auto;white-space:nowrap}
nav.toc .in{max-width:980px;margin:0 auto;display:flex;gap:6px}
nav.toc a{font-family:var(--mono);font-size:.76rem;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid transparent}
nav.toc a.on{color:var(--ink);border-color:var(--line);background:var(--surface)}

/* sections */
section.st{padding-block:56px 8px;display:flex;flex-direction:column;gap:22px;scroll-margin-top:60px}
.sec-head{display:flex;flex-direction:column;gap:8px}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.lab-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lab-head h3{font-family:var(--serif)}
.tag{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:4px}
.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1}
.ctl label{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl label output{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;font-size:.82rem;padding:6px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.btn{all:unset;cursor:pointer;font-size:.85rem;font-weight:500;padding:8px 14px;border-radius:7px;background:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.note{font-size:.9rem;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.callout{background:var(--accent-soft);border-radius:8px;padding:14px 16px;font-size:.95rem}
.callout b{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.readout{display:flex;flex-wrap:wrap;gap:22px}
.readout div{display:flex;flex-direction:column}
.readout small{font-size:.74rem;color:var(--muted)}
.readout strong{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.formula{font-family:var(--mono);font-size:.9rem;background:var(--surface-2);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:nowrap}

/* token strip */
.tokens{display:flex;flex-wrap:wrap;gap:4px}
.tok{font-family:var(--mono);font-size:.85rem;padding:4px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.tok.prompt{color:var(--muted);background:var(--surface-2);border-style:dashed}
.tok.resp{border-color:var(--accent);background:var(--accent-soft)}
button.tok{cursor:pointer;color:var(--ink)}
button.tok.sel{outline:2px solid var(--ink);outline-offset:1px}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 52px;gap:10px;align-items:center;font-size:.86rem}
.barrow .track{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.barrow .fill{height:100%;background:var(--accent);transition:width .25s}
.barrow .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.sample{font-family:var(--mono);font-size:.85rem;background:var(--surface-2);border-radius:6px;padding:12px 14px;white-space:pre-wrap}

/* diagram boxes */
.diag{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.82rem;background:var(--surface);line-height:1.3}
.box.hot{border-color:var(--accent);background:var(--accent-soft)}
.box.dead{border-style:dashed;color:var(--muted);text-decoration:line-through}
.arr{color:var(--muted);font-family:var(--mono)}
.diag-title{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* grpo table */
.gtable{width:100%;border-collapse:collapse;font-size:.86rem}
.gtable th{text-align:left;font-weight:500;color:var(--muted);font-size:.76rem;padding:6px 8px;border-bottom:1px solid var(--line)}
.gtable td{padding:5px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.gtable td.mono{font-family:var(--mono)}
.pill{font-family:var(--mono);font-size:.74rem;padding:1px 7px;border-radius:999px}
.pill.ok{color:var(--good);background:var(--good-soft)}
.pill.ko{color:var(--bad);background:var(--bad-soft)}
.scroll-x{overflow-x:auto}

/* summary */
table.sum{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
table.sum th{text-align:left;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:10px;border-bottom:1px solid var(--ink)}
table.sum td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum td:first-child{font-family:var(--serif);font-weight:650;font-size:1rem}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

/* concetti base */
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loop .box{display:flex;flex-direction:column;gap:4px;padding:12px}
.loop .box b{font-family:var(--serif);font-size:1rem}
.loop .box span{color:var(--muted);font-size:.82rem}
.loop .box em{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--accent)}
@media (max-width:760px){.loop{grid-template-columns:1fr 1fr}}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.gloss div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.gloss dt{font-family:var(--serif);font-weight:650}
.gloss dd{margin:0;font-size:.88rem;color:var(--muted)}
.gloss .ex{font-family:var(--mono);font-size:.74rem;color:var(--ink)}
textarea{width:100%;font-family:var(--mono);font-size:.9rem;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}

/* componenti comuni */
.anchor{scroll-margin-top:70px;margin-top:10px;font-size:1.35rem;font-weight:650}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid3 .box{display:flex;flex-direction:column;gap:4px;padding:12px}
.grid3 .box b{font-family:var(--serif)}
.grid3 .box span{color:var(--muted);font-size:.84rem}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cards a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;transition:border-color .15s}
.cards a:hover{border-color:var(--accent)}
.cards a b{font-family:var(--serif);font-size:1.05rem}
.cards a span{font-size:.84rem;color:var(--muted)}
.cards a small{font-family:var(--mono);font-size:.7rem;color:var(--accent)}
</style>
