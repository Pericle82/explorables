<figure class="fig">
<p class="fig-title">Chi guarda chi <span class="tag">calcolo reale</span></p>
<div><svg id="g36-svg" style="max-width:480px;margin:0 auto" viewBox="0 0 400 396" role="img" aria-label="Mappa di attention 8 per 8 sulla frase «Il gatto vede il topo e lo insegue»: le caselle più scure sono pesi maggiori."></svg></div>
<div class="callout" id="g36-msg" style="margin-top:8px">Passa il mouse o tocca una casella.</div>
<div class="readout" style="margin-top:10px">
  <div><small>Somma della riga selezionata</small><strong id="g36-rs"></strong></div>
  <div><small>Somma della colonna selezionata</small><strong id="g36-cs"></strong></div>
</div>
<figcaption>Una testa di un Transformer di tipo generativo (ogni token vede solo i precedenti, per questo il triangolo in alto è vuoto). Righe: chi guarda; colonne: chi è guardato. I punteggi sono scelti a mano per illustrare; i pesi sono calcolati con il softmax, quindi ogni riga somma al 100%, mentre le colonne no. Nota il pronome «lo» che si accende su «topo» e la prima colonna («Il») che assorbe molto peso senza dire nulla: è l'attention sink (pozzo di attention). Questa è una mappa di una testa; ogni testa di ogni layer ne ha una diversa.</figcaption>
</figure>
<script>
const svg=G.$("#g36-svg");if(!svg)return;
const T=(p,x,y,s,sz,a,f)=>{const t=G.el("text",{x,y,"text-anchor":a||"start"},p,s);t.style.fontSize=(sz||11)+"px";if(f)t.style.fill=f;return t;};
const W=["Il","gatto","vede","il","topo","e","lo","insegue"],N=8;
// punteggi (logit) scelti a mano: sink sul primo token, parola precedente, legami sintattici
const L=W.map((_,i)=>W.map((_,j)=>j>i?-1e9:(j===0?1.1:-0.4)+(j===i-1?0.9:0)+(j===i?0.3:0)));
L[1][1]+=0.4;
L[2][1]+=2.2;
L[3][2]+=0.6;
L[4][3]+=1.8;L[4][2]+=0.9;
L[5][4]+=0.5;
L[6][4]+=3.4;L[6][1]+=1.1;
L[7][6]+=1.4;L[7][1]+=1.9;L[7][4]+=1.0;
const A=L.map(r=>{const e=r.map(v=>v<-1e8?0:Math.exp(v));const z=e.reduce((a,b)=>a+b,0);return e.map(v=>v/z);});
const X0=64,Y0=58,C=41;
let sel=[6,4];
function draw(){
  G.clear(svg);
  T(svg,X0+N*C/2,14,"token guardato (colonne)",11,"middle","var(--muted)");
  T(svg,10,Y0+N*C/2,"chi guarda (righe)",11,"middle","var(--muted)").setAttribute("transform",`rotate(-90 10 ${Y0+N*C/2})`);
  W.forEach((w,j)=>{const t=T(svg,X0+j*C+C/2,Y0-8,w,11,"end",j===sel[1]?"var(--ink)":"var(--muted)");t.setAttribute("transform",`rotate(-55 ${X0+j*C+C/2} ${Y0-8})`);t.style.fontWeight=j===sel[1]?"700":"400";});
  W.forEach((w,i)=>T(svg,X0-6,Y0+i*C+C/2+4,w,11,"end",i===sel[0]?"var(--ink)":"var(--muted)").style.fontWeight=i===sel[0]?"700":"400");
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x=X0+j*C,y=Y0+i*C,m=j>i;
    const r=G.el("rect",{x:x+1,y:y+1,width:C-2,height:C-2,rx:3,fill:m?"var(--surface-2)":"var(--accent)",opacity:m?.6:(.06+A[i][j]*.94).toFixed(2),tabindex:m?-1:0},svg);
    if(m)continue;
    const pick=()=>{sel=[i,j];draw();};
    r.style.cursor="pointer";r.addEventListener("mouseenter",pick);r.addEventListener("click",pick);r.addEventListener("focus",pick);
  }
  const [a,b]=sel;
  G.el("rect",{x:X0,y:Y0+a*C,width:N*C,height:C,fill:"none",stroke:"var(--ink)","stroke-width":1.5,"pointer-events":"none"},svg);
  G.el("rect",{x:X0+b*C,y:Y0,width:C,height:N*C,fill:"none",stroke:"var(--ink)","stroke-width":1.5,"stroke-dasharray":"4 3","pointer-events":"none"},svg);
  const v=A[a][b];
  const t=T(svg,X0+b*C+C/2,Y0+a*C+C/2+4,G.fmt(v*100,0)+"%",11,"middle");t.style.pointerEvents="none";t.style.paintOrder="stroke";t.style.stroke="var(--surface)";t.style.strokeWidth="3px";
  G.$("#g36-msg").innerHTML="«<b>"+W[a]+"</b>» guarda «<b>"+W[b]+"</b>» con peso <b>"+G.fmt(v*100,1)+"%</b>"+(b===0&&a>0?" (il primo token fa da «parcheggio» per il peso)":"")+".";
  const rs=A[a].reduce((s,x)=>s+x,0),cs=A.reduce((s,r)=>s+r[b],0);
  G.$("#g36-rs").textContent=G.fmt(rs*100,0)+"%";G.$("#g36-cs").textContent=G.fmt(cs*100,0)+"% (non deve fare 100)";
}
draw();
</script>
