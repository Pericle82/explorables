
<script>
/* Script della guida: scroll spy, pulsante Copia e terminale simulato */
(function(){
  const $=s=>document.querySelector(s);
  const links=[...document.querySelectorAll("nav.toc a")],secs=links.map(a=>document.querySelector(a.getAttribute("href")));
  function spy(){let c=0;secs.forEach((s,i)=>{if(s&&s.getBoundingClientRect().top<140)c=i;});links.forEach((a,i)=>a.classList.toggle("on",i===c));}
  addEventListener("scroll",spy,{passive:true});spy();

  /* ======================================================================
     TERMINALE SIMULATO
     File system finto in memoria; ogni comando della guida viene aggiunto
     alla tabella CMDS nel momento in cui entra nel testo.
     Un elemento <div class="term" data-term data-try="cmd1|cmd2"> diventa un terminale.
     ====================================================================== */
  const USER="joe",HOST="guida",HOME="/home/joe";
  /* nodo: {t:"d"|"f", c:{nome:nodo} (per d), s:testo (per f), m:"rwxr-xr-x", d:"ott  3 10:12" } */
  const D=(c,m)=>({t:"d",c:c||{},m:m||"rwxr-xr-x",d:"ott  3 10:12"});
  const F=(s,m,d)=>({t:"f",s:s||"",m:m||"rw-r--r--",d:d||"ott  3 10:12"});
  function mkfs(){return D({
    bin:D({ls:F("",'rwxr-xr-x'),cat:F("",'rwxr-xr-x'),echo:F("",'rwxr-xr-x'),pwd:F("",'rwxr-xr-x'),bash:F("",'rwxr-xr-x')}),
    etc:D({hostname:F("guida\n"),hosts:F("127.0.0.1\tlocalhost\n"),passwd:F("root:x:0:0:root:/root:/bin/bash\njoe:x:1000:1000:Joe:/home/joe:/bin/bash\n")}),
    home:D({joe:D({
      ".bashrc":F("# ~/.bashrc\nalias ll='ls -la'\nexport EDITOR=nano\n"),
      ".ssh":D({config:F("Host server\n  HostName 10.0.0.5\n  User joe\n")},"rwx------"),
      Documenti:D({"appunti.txt":F("Comprare il latte\nChiamare Anna\nFinire la guida sulla shell\n"),"prezzi.csv":F("prodotto,prezzo,quantita\nlatte,1.20,6\npane,2.50,2\ncaffe,4.80,1\nmele,3.10,4\nbiscotti,2.20,3\n"),"vendite.txt":F("gennaio   120   4500.00\nfebbraio   98   3720.50\nmarzo     143   5210.00\n"),"relazione.md":F("# Relazione\n\nPrima bozza.\n"),"Fatture 2026":D({"gennaio.pdf":F("%PDF-1.4 (binario)\n"),"febbraio.pdf":F("%PDF-1.4 (binario)\n")})}),
      Scaricati:D({"foto.jpg":F("(binario)\n"),"archivio.zip":F("(binario)\n"),"installer.sh":F("#!/bin/bash\necho installo...\n","rwxr-xr-x")}),
      progetti:D({explorables:D({"README.md":F("# Explorables\n\nGuide interattive.\n"),docs:D({"transazioni.html":F("<title>…</title>\n"),"training-llm.html":F("<title>…</title>\n")}),scripts:D({"build.mjs":F("// build\n","rwxr-xr-x")})})}),
      "note.txt":F("Ricordati: i comandi sono frasi.\n"),
    })}),
    tmp:D({},"rwxrwxrwt"),
    usr:D({bin:D({grep:F("",'rwxr-xr-x'),find:F("",'rwxr-xr-x'),man:F("",'rwxr-xr-x')})}),
  })}
  /* risoluzione dei percorsi */
  function norm(cwd,p){if(!p)p=cwd;if(p==="~")p=HOME;else if(p.startsWith("~/"))p=HOME+p.slice(1);if(!p.startsWith("/"))p=cwd.replace(/\/$/,"")+"/"+p;
    const out=[];p.split("/").forEach(s=>{if(!s||s===".")return;if(s==="..")out.pop();else out.push(s);});return "/"+out.join("/");}
  function get(fs,path){if(path==="/")return fs;let n=fs;for(const s of path.split("/").filter(Boolean)){if(!n||n.t!=="d"||!(s in n.c))return null;n=n.c[s];}return n;}
  const base=p=>p.split("/").filter(Boolean).pop()||"/";
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const q=n=>/[ ()'"&;|]/.test(n)?"'"+n+"'":n;
  /* parsing minimale: spazi, virgolette semplici e doppie, $VAR e ~ */
  function tokenize(line,env){const out=[];let cur="",inS=false,inD=false,has=false;
    for(let i=0;i<line.length;i++){const ch=line[i];
      if(inS){if(ch==="'")inS=false;else cur+=ch;continue;}
      if(ch==="\\"&&i+1<line.length&&!inS){cur+=line[++i];has=true;continue;}
      if(ch==="'"&&!inD){inS=true;has=true;continue;}
      if(ch==='"'){inD=!inD;has=true;continue;}
      if(ch==="$"&&/[A-Za-z_]/.test(line[i+1]||"")){let j=i+1,name="";while(j<line.length&&/[A-Za-z0-9_]/.test(line[j]))name+=line[j++];cur+=(env[name]??"");i=j-1;has=true;continue;}
      if(ch==="$"&&/[0-9]/.test(line[i+1]||"")){i++;has=true;continue;} /* $1…$9: parametri posizionali, qui vuoti */
      if((ch==="|"||ch===";")&&!inD){if(cur||has){out.push(cur);cur="";has=false;}out.push({op:ch});continue;}
      if(ch===" "&&!inD){if(cur||has){out.push(cur);cur="";has=false;}continue;}
      cur+=ch;has=true;}
    if(cur||has)out.push(cur);
    return out.map(t=>typeof t==="string"&&(t==="~"||t.startsWith("~/"))?HOME+t.slice(1):t);}
  function opts(args,spec){const o={},rest=[];for(const a of args){if(a==="--"){continue;}if(a.startsWith("--")&&spec.long&&spec.long[a.slice(2)]){o[spec.long[a.slice(2)]]=true;}else if(a.startsWith("--")){throw {code:2,msg:`${spec.name}: unrecognized option '${a}'\nTry '${spec.name} --help' for more information.`,mac:`su macOS le opzioni lunghe (--…) di solito non esistono: ${spec.name} risponderebbe «illegal option».`};}
    else if(a.startsWith("-")&&a.length>1){for(const ch of a.slice(1)){if(spec.short&&spec.short.includes(ch))o[ch]=true;else throw {code:2,msg:`${spec.name}: invalid option -- '${ch}'\nTry '${spec.name} --help' for more information.`};}}else rest.push(a);}return {o,rest};}
  /* ---- comandi: ogni voce = {help, man, run(ctx,args) → {out, code, mac?}} ---- */
  const CMDS={};
  CMDS.help={help:"elenca i comandi che il terminale conosce",run(ctx){return {out:"Comandi disponibili in questo terminale simulato:\n"+Object.keys(CMDS).sort().map(k=>"  "+k.padEnd(8)+" "+CMDS[k].help).join("\n")+"\n\nI comandi arrivano man mano che entrano nella guida; «anteprima» = disponibile ma senza scheda.",code:0};}};
  CMDS.pwd={help:"stampa la cartella corrente (print working directory)",man:"pwd - print name of current/working directory\n\nSYNOPSIS\n       pwd [OPTION]...\n\nStampa il percorso assoluto della cartella in cui ti trovi. È un builtin della shell.",run(ctx){return {out:ctx.cwd,code:0};}};
  CMDS.cd={help:"cambia cartella (change directory)",man:"cd - change the shell working directory\n\nSYNOPSIS\n       cd [dir]\n\nSenza argomenti porta alla home (~). «cd -» torna alla cartella precedente. È un builtin: deve cambiare lo stato della shell stessa.",run(ctx,args){
      let t=args[0]??HOME;if(t==="-")t=ctx.prev||ctx.cwd;const p=norm(ctx.cwd,t);const n=get(ctx.fs,p);
      if(!n)return {out:`bash: cd: ${args[0]}: No such file or directory`,code:1};
      if(n.t!=="d")return {out:`bash: cd: ${args[0]}: Not a directory`,code:1};
      ctx.prev=ctx.cwd;ctx.cwd=p;return {out:args[0]==="-"?p:"",code:0};}};
  CMDS.ls={help:"elenca il contenuto di una cartella (list)",man:"ls - list directory contents\n\nSYNOPSIS\n       ls [OPTION]... [FILE]...\n\n  -a, --all        non nascondere i file che iniziano con .\n  -l               formato lungo: permessi, proprietario, dimensione, data\n  -h               con -l, dimensioni leggibili (K, M)\n\nmacOS (BSD): stesse opzioni corte; i colori sono -G invece di --color.",
    run(ctx,args){const {o,rest}=opts(args,{name:"ls",short:"alh1",long:{all:"a",help:"HELP"}});
      if(o.HELP)return {out:"Usage: ls [OPTION]... [FILE]...\nList information about the FILEs (the current directory by default).\n  -a, --all    do not ignore entries starting with .\n  -l           use a long listing format\n  -h           with -l, print sizes like 1K 234M 2G",code:0,mac:"su macOS «ls --help» dà «illegal option»: usa «man ls»."};
      const targets=rest.length?rest:["."];let out=[],code=0;
      targets.forEach((t,i)=>{const p=norm(ctx.cwd,t),n=get(ctx.fs,p);
        if(!n){out.push(`ls: cannot access '${t}': No such file or directory`);code=2;return;}
        if(targets.length>1&&n.t==="d")out.push((i?"\n":"")+t+":");
        const entries=n.t==="d"?Object.keys(n.c).sort((a,b)=>a.localeCompare(b,"it")).filter(k=>o.a||!k.startsWith(".")):[base(p)];
        const list=n.t==="d"&&o.a?[".","..",...entries]:entries;
        const node=k=>k==="."?n:k===".."?get(ctx.fs,norm(p,".."))||ctx.fs:n.t==="d"?n.c[k]:n;
        const paint=k=>{const x=node(k);const nm=esc(q(k));return x.t==="d"?`<span class="dir">${nm}/</span>`:x.m.includes("x")?`<span class="exe">${nm}*</span>`:nm;};
        if(o.l){const sz=x=>x.t==="d"?4096:x.s.length*37;const hs=v=>o.h?(v>=1048576?(v/1048576).toFixed(1)+"M":v>=1024?Math.round(v/1024)+"K":v+""):v+"";
          out.push(`total ${list.length*4}`);list.forEach(k=>{const x=node(k);out.push(`${x.t==="d"?"d":"-"}${x.m} ${String(x.t==="d"?Object.keys(x.c).length+2:1).padStart(2)} ${USER.padEnd(5)} ${USER.padEnd(5)} ${hs(sz(x)).padStart(6)} ${x.d} ${paint(k)}`);});}
        else if(ctx.toPipe)out.push(list.map(k=>esc(k)).join("\n"));
        else out.push(list.map(paint).join("  "));});
      return {out:out.join("\n"),code,html:true};}};
  CMDS.cat={help:"mostra il contenuto di uno o più file (concatenate)",man:"cat - concatenate files and print on the standard output\n\nSYNOPSIS\n       cat [OPTION]... [FILE]...",run(ctx,args){const {rest}=opts(args,{name:"cat",short:"n"});if(!rest.length)return ctx.stdin!=null?{out:ctx.stdin.replace(/\n$/,""),code:0}:{out:"(cat senza argomenti legge dalla tastiera: qui non è simulato; premi Ctrl+D per uscire in una shell vera)",code:0};let out=[],code=0;rest.forEach(t=>{const n=get(ctx.fs,norm(ctx.cwd,t));if(!n){out.push(`cat: ${t}: No such file or directory`);code=1;}else if(n.t==="d"){out.push(`cat: ${t}: Is a directory`);code=1;}else out.push(n.s.replace(/\n$/,""));});return {out:out.join("\n"),code};}};
  CMDS.echo={help:"stampa i suoi argomenti",man:"echo - display a line of text\n\nSYNOPSIS\n       echo [SHORT-OPTION]... [STRING]...\n\nStampa gli argomenti separati da uno spazio. Le variabili ($HOME, $SHELL) le espande la shell prima che echo le veda.",run(ctx,args){return {out:args.join(" "),code:0};}};
  CMDS.type={help:"dice se un comando è builtin o programma",man:"type - display information about command type\n\nSYNOPSIS\n       type name...",run(ctx,args){if(!args.length)return {out:"",code:0};const B=["cd","pwd","echo","type","help","history","exit"];return {out:args.map(a=>B.includes(a)?`${a} is a shell builtin`:CMDS[a]?`${a} is /usr/bin/${a}`:`bash: type: ${a}: not found`).join("\n"),code:args.every(a=>B.includes(a)||CMDS[a])?0:1};}};
  CMDS.whoami={help:"stampa il nome dell'utente",run(){return {out:USER,code:0};}};
  CMDS.clear={help:"pulisce lo schermo",run(ctx){ctx.clear=true;return {out:"",code:0};}};
  CMDS.history={help:"elenca i comandi digitati",run(ctx){return {out:ctx.hist.map((h,i)=>String(i+1).padStart(5)+"  "+h).join("\n"),code:0};}};
  CMDS.man={help:"apre il manuale di un comando",run(ctx,args){const c=args[0];if(!c)return {out:"What manual page do you want?\nFor example, try 'man man'.",code:1};const m=CMDS[c]&&CMDS[c].man;if(!m)return {out:`No manual entry for ${c}`,code:16};return {out:`${c.toUpperCase()}(1)                      User Commands                      ${c.toUpperCase()}(1)\n\nNAME\n       ${m}\n\n(in una shell vera: frecce per scorrere, /parola per cercare, q per uscire)`,code:0,dim:true};}};
  CMDS.exit={help:"chiude la shell",run(ctx){return {out:"logout\n(in questa simulazione la shell riparte da sola)",code:0};}};
  CMDS.tldr={help:"esempi pratici di un comando",run(ctx,args){const c=args[0];if(!c||!CMDS[c])return {out:`tldr: page not found for ${c||"(niente)"}`,code:1};return {out:`${c}\n\n  ${CMDS[c].help}.\n\n(tldr mostra 4-5 esempi: nel terminale simulato il contenuto arriva con la scheda del comando)`,code:0};}};

  /* ---- esecuzione di una riga: $?, $(…), «;» e pipe ---- */
  function envOf(ctx){return {HOME,USER:ctx.root?"root":USER,SHELL:"/bin/bash",PWD:ctx.cwd,PATH:"/usr/local/bin:/usr/bin:/bin",EDITOR:"nano","?":String(ctx.last)};}
  function substitute(ctx,line){/* $( … ) una volta, senza annidamento; $? viene sostituito comando per comando */
    return line.replace(/\$\(([^()]*)\)/g,(m,inner)=>{const r=runLine(ctx,inner,true);return (r.out||"").replace(/<[^>]+>/g,"").trim().replace(/\s*\n\s*/g," ");});}
  function runSimple(ctx,toks,stdin){const [c,...args]=toks;
    if(c==="sudo"){if(!args.length)return {out:"usage: sudo command",code:1};ctx.root=true;try{return runSimple(ctx,args,stdin);}finally{ctx.root=false;}}
    const cmd=CMDS[c];
    if(!cmd)return {out:`bash: ${c}: command not found`,code:127,hint:/^(ls|cd|grep|find|cp|mv|rm|mkdir|cat|less|head|tail|chmod|sudo|ps|kill|tar|curl|ssh|git|awk|cut|lsof|sed|sort|uniq|wc)$/.test(c)?null:"Questo comando non è ancora entrato nella guida: il terminale lo imparerà quando arriverà la sua scheda."};
    ctx.stdin=stdin;
    try{return cmd.run(ctx,args);}catch(e){if(e&&e.msg)return {out:e.msg,code:e.code||1,mac:e.mac};return {out:`bash: ${c}: errore interno della simulazione`,code:1};}}
  function runLine(ctx,line,quiet){line=substitute(ctx,line);let toks;try{toks=tokenize(line,envOf(ctx));}catch(e){return {out:"bash: errore di sintassi",code:2};}
    /* separa in comandi per «;», ciascuno in stadi per «|» */
    const cmds=[[]];toks.forEach(t=>{if(typeof t==="object"&&t.op===";")cmds.push([]);else cmds[cmds.length-1].push(t);});
    const outs=[];let macs=[],hints=[],html=false,dim=false;
    for(const cm0 of cmds){const cm=cm0.map(t=>typeof t==="string"?t.replace(/\$\?/g,String(ctx.last)):t);const stages=[[]];cm.forEach(t=>{if(typeof t==="object"&&t.op==="|")stages.push([]);else stages[stages.length-1].push(t);});
      if(stages.some(st=>!st.length)){if(cm.length){outs.push("bash: syntax error near unexpected token `|'");ctx.last=2;}continue;}
      let stdin=null,r={out:"",code:0};
      for(let i=0;i<stages.length;i++){ctx.toPipe=i<stages.length-1;r=runSimple(ctx,stages[i],stdin);if(r.mac)macs.push(r.mac);if(r.hint)hints.push(r.hint);if(i<stages.length-1){stdin=(r.out||"").replace(/<[^>]+>/g,"");r.piped=true;}}
      if(r.out)outs.push(r.code?`<span class="err">${r.html?r.out:esc(r.out)}</span>`:(r.dim?`<span class="dim">${esc(r.out)}</span>`:(r.html?r.out:esc(r.out))));
      ctx.last=r.code||0;}
    return {out:outs.join("\n"),code:ctx.last,html:true,mac:macs.join(" · ")||null,hint:hints.join(" · ")||null};}
  /* input di un comando: file argomenti, altrimenti la pipe */
  function readInput(ctx,files){if(files.length){let txt="",err=null;files.forEach(f=>{const n=get(ctx.fs,norm(ctx.cwd,f));if(!n)err=(err||"")+`${f}: No such file or directory\n`;else if(n.t==="d")err=(err||"")+`${f}: Is a directory\n`;else txt+=n.s;});return {txt,err};}
    return {txt:ctx.stdin??"",err:ctx.stdin==null?"(nessun input: dai un file o usa una pipe)":null};}
  const lines=t=>t.replace(/\n$/,"").split("\n").filter((l,i,a)=>!(a.length===1&&l===""));

  /* ---- grep (anteprima minima) ---- */
  CMDS.grep={help:"cerca righe che contengono un testo (anteprima: scheda in arrivo)",run(ctx,args){const {o,rest}=opts(args,{name:"grep",short:"invcE"});if(!rest.length)return {out:"Usage: grep [OPTION]... PATTERNS [FILE]...",code:2};
      const [pat,...files]=rest;let re;try{re=new RegExp(pat,o.i?"i":"");}catch(e){return {out:`grep: ${pat}: espressione non valida`,code:2};}
      const {txt,err}=readInput(ctx,files);if(err&&!txt)return {out:"grep: "+err.trim(),code:2};
      const hit=lines(txt).map((l,i)=>[l,i+1]).filter(([l])=>re.test(l)!==!!o.v);
      if(o.c)return {out:String(hit.length),code:hit.length?0:1};
      return {out:hit.map(([l,i])=>(o.n?i+":":"")+l).join("\n"),code:hit.length?0:1};}};
  /* ---- cut ---- */
  CMDS.cut={help:"estrae colonne con un separatore fisso",man:"cut - remove sections from each line of files\n\nSYNOPSIS\n       cut OPTION... [FILE]...\n\n  -d DELIM   separatore (default: tab)\n  -f LIST    campi da stampare: 2, 1,3, 2-4\n\nNon unisce separatori ripetuti: con gli spazi multipli usa awk.",
    run(ctx,args){let d="\t",f=null,files=[];for(let i=0;i<args.length;i++){const a=args[i];if(a==="-d")d=args[++i]??"";else if(a.startsWith("-d"))d=a.slice(2);else if(a==="-f")f=args[++i];else if(a.startsWith("-f"))f=a.slice(2);else if(a.startsWith("-"))throw {code:1,msg:`cut: invalid option -- '${a.slice(1)}'\nTry 'cut --help' for more information.`};else files.push(a);}
      if(!f)return {out:"cut: you must specify a list of bytes, characters, or fields\nTry 'cut --help' for more information.",code:1};
      if(d.length!==1)return {out:"cut: the delimiter must be a single character",code:1};
      const want=new Set();f.split(",").forEach(p=>{const m=p.match(/^(\d*)-(\d*)$/);if(m){const a=+(m[1]||1),b=+(m[2]||99);for(let k=a;k<=b;k++)want.add(k);}else want.add(+p);});
      const {txt,err}=readInput(ctx,files);if(err&&!txt)return {out:"cut: "+err.trim(),code:1};
      return {out:lines(txt).map(l=>{if(!l.includes(d))return l;const cols=l.split(d);return cols.filter((c,i)=>want.has(i+1)).join(d);}).join("\n"),code:0};}};
  /* ---- awk (sottoinsieme) ---- */
  CMDS.awk={help:"legge righe, le spezza in colonne, filtra e stampa",man:"awk - pattern scanning and processing language\n\nSYNOPSIS\n       awk [-F sep] 'program' [file ...]\n\n  program = [condizione] { print … }\n  $1 $2 … campi, $0 riga intera, NR numero di riga, NF numero di campi\n  condizioni: NR>1, NR==5, $1==\"x\", $3>100\n\nLinux: gawk · macOS: awk BSD. Le forme di base sono identiche.",
    run(ctx,args){let FS=null,prog=null,files=[];for(let i=0;i<args.length;i++){const a=args[i];if(a==="-F")FS=args[++i];else if(a.startsWith("-F"))FS=a.slice(2);else if(prog===null)prog=a;else files.push(a);}
      if(prog===null)return {out:"usage: awk [-F fs] 'prog' [file ...]",code:2};
      if(FS==="\\t")FS="\t";
      /* parse: cond {action} */
      const m=prog.trim().match(/^(.*?)\s*\{\s*(.*?)\s*\}\s*$/s);
      if(!m)return {out:`awk: syntax error at source line 1\n context is\n\t>>> ${prog} <<<\nawk: bailing out at source line 1`,code:2,hint:prog.includes("print")?"manca una graffa: il programma di awk è «condizione {azione}»":"il programma va tra apici singoli: awk '{print $2}'"};
      const cond=m[1].trim(),action=m[2].trim();
      const condF=parseCond(cond);if(!condF)return {out:`awk: syntax error in condition: ${cond}`,code:2};
      const am=action.match(/^print\b\s*(.*)$/);if(!am&&action!=="")return {out:`awk: in questa simulazione l'azione può essere solo print …`,code:2};
      const items=am?splitItems(am[1]):["$0"];
      const {txt,err}=readInput(ctx,files);if(err&&!txt)return {out:"awk: "+err.replace(/\n$/,"").replace(/\n/g,"\nawk: "),code:2};
      const out=[];lines(txt).forEach((l,i)=>{const F=FS==null?l.trim().split(/[ \t]+/):l.split(FS);const rec={l,F,NR:i+1,NF:F.length};if(!condF(rec))return;
        /* virgola tra gli item = spazio; item adiacenti senza virgola = concatenati */
        out.push(items.map(it=>evalItem(it,rec)).join(" "));});
      return {out:out.join("\n"),code:0,hint:(out.length===0&&lines(txt).length===0)?"awk non ha stampato nulla perché non ha ricevuto nulla in input: il comando prima della pipe non ha prodotto output":null};}};
  function field(rec,k){return k===0?rec.l:(rec.F[k-1]??"");}
  function evalItem(it,rec){it=it.trim();let out="";/* concatenazione di pezzi adiacenti */const parts=it.match(/"[^"]*"|\$[0-9]+|\$NF|NR|NF|[0-9.]+/g)||[];for(const p of parts){if(p.startsWith('"'))out+=p.slice(1,-1);else if(p==="$NF")out+=field(rec,rec.NF);else if(p.startsWith("$"))out+=field(rec,+p.slice(1));else if(p==="NR")out+=rec.NR;else if(p==="NF")out+=rec.NF;else out+=p;}return out;}
  function splitItems(s){if(!s.trim())return ["$0"];const items=[];let cur="",inQ=false;for(const ch of s){if(ch==='"')inQ=!inQ;if(ch===","&&!inQ){items.push(cur);cur="";}else cur+=ch;}items.push(cur);return items;}
  function parseCond(c){if(!c)return ()=>true;const m=c.match(/^(\$\d+|NR|NF)\s*(==|!=|>=|<=|>|<)\s*("[^"]*"|-?[0-9.]+)$/);if(!m)return null;const [,L,op,R]=m;
    return rec=>{const lv=L==="NR"?rec.NR:L==="NF"?rec.NF:field(rec,+L.slice(1));const isStr=R.startsWith('"');const rv=isStr?R.slice(1,-1):+R;const a=isStr?String(lv):+lv;
      switch(op){case "==":return a==rv;case "!=":return a!=rv;case ">":return a>rv;case "<":return a<rv;case ">=":return a>=rv;case "<=":return a<=rv;}return false;};}
  /* ---- lsof -i ---- */
  CMDS.lsof={help:"elenca chi ha aperto file e porte (qui: -i per le porte)",man:"lsof - list open files\n\nSYNOPSIS\n       lsof [-t] [-P] [-n] [-i [TCP][:port]] [-sTCP:LISTEN]\n\n  -i [:port]  connessioni di rete, opzionalmente solo su una porta\n  -iTCP:port  solo TCP su quella porta (forme attaccate: -i:4173, -ti:4173)\n  -sTCP:LISTEN  solo i socket in ascolto\n  -t          solo i PID, uno per riga (per gli script)\n  -P -n       non tradurre porte e indirizzi in nomi (più veloce)\n\nMostra solo i processi del tuo utente: per gli altri serve sudo. Identico su Linux e macOS; alternative: ss -ltnp (Linux), netstat -anv (macOS).",
    run(ctx,args){let net=false,port=null,terse=false;
      const takeI=s=>{net=true;const m=/^(?:TCP|tcp|UDP|udp|4|6)?(?:@[^:]*)?:(\d+)$/.exec(s);if(m)port=+m[1];else if(!/^(TCP|tcp|UDP|udp|4|6)$/.test(s))return false;return true;};
      for(let i=0;i<args.length;i++){const a=args[i];
        if(a==="-i"){net=true;const nx=args[i+1];if(nx&&!nx.startsWith("-")&&takeI(nx))i++;}
        else if(/^-[tnP]*i/.test(a)){const k=a.indexOf("i");if(a.slice(1,k).includes("t"))terse=true;const rest=a.slice(k+1);if(rest){if(!takeI(rest))return {out:`lsof: unacceptable Internet address: ${rest}`,code:1};}else net=true;}
        else if(a==="-s"){i++;}
        else if(/^-s(TCP|UDP):/i.test(a)){}
        else if(/^-[tPn]+$/.test(a)){if(a.includes("t"))terse=true;}
        else if(a.startsWith("-"))return {out:`lsof: unknown option -- ${a.slice(1)}\nlsof 4.99.0\n latest revision: https://github.com/lsof-org/lsof`,code:1};
        else return {out:`lsof: status error on ${a}: No such file or directory`,code:1};}
      if(!net)return {out:"(in questa simulazione lsof conosce solo la forma -i [:porta])",code:1};
      const vis=ctx.procs.filter(p=>(ctx.root||p.user===USER)&&(port==null||p.port===port));
      if(!vis.length){const hidden=ctx.procs.some(p=>port!=null&&p.port===port&&p.user!==USER);return {out:"",code:1,hint:hidden?`nessun output ed exit 1, ma la porta ${port} è occupata da un processo di un altro utente: lsof mostra solo i tuoi, prova con sudo`:port!=null?`nessun output ed exit 1: nessun processo del tuo utente usa la porta ${port}`:null};}
      if(terse)return {out:vis.map(p=>p.pid).join("\n"),code:0};
      const row=p=>`${p.cmd.padEnd(8)} ${String(p.pid).padStart(6)} ${(ctx.root&&p.user!==USER?p.user:p.user).padEnd(9)} ${p.fd.padEnd(4)} ${p.type.padEnd(5)} 0x${(p.pid*2654435761%0xffffffff).toString(16).padStart(8,"0")}      0t0  TCP *:${p.port} (LISTEN)`;
      return {out:"COMMAND     PID USER      FD   TYPE  DEVICE SIZE/OFF NODE NAME\n"+vis.map(row).join("\n"),code:0};}};
  /* ---- ss (Linux) ---- */
  CMDS.ss={help:"socket statistics: porte e connessioni (Linux, al posto di netstat)",man:"ss - another utility to investigate sockets\n\nSYNOPSIS\n       ss [-l] [-t] [-n] [-p] [filtro]\n\n  -l  solo in ascolto (LISTEN)   -t  solo TCP\n  -n  numeri, non nomi           -p  mostra il processo\n  filtro: 'sport = :4173' (porta locale)\n\nSolo Linux (pacchetto iproute2). Su macOS non esiste: usa lsof o netstat -anv.",
    run(ctx,args){let port=null,proc=false;for(const a of args){if(/^-[ltnpau]+$/.test(a)){if(a.includes("p"))proc=true;}else{const m=/sport\s*=\s*:(\d+)/.exec(a);if(m)port=+m[1];else return {out:`ss: bad filter: ${a}`,code:1};}}
      const vis=ctx.procs.filter(p=>port==null||p.port===port);
      const row=p=>`LISTEN 0      511    ${(p.type==="IPv6"?"*":"0.0.0.0")+":"+p.port}`.padEnd(42)+`${p.type==="IPv6"?"*:*":"0.0.0.0:*"}`.padEnd(12)+(proc&&(ctx.root||p.user===USER)?` users:(("${p.cmd}",pid=${p.pid},fd=${parseInt(p.fd)}))`:"");
      return {out:"State  Recv-Q Send-Q Local Address:Port".padEnd(42)+"Peer Address:Port Process\n"+vis.map(row).join("\n"),code:0,hint:vis.some(p=>p.user!==USER)&&proc&&!ctx.root?"le righe senza «users:(…)» sono processi di altri utenti: senza sudo ss non mostra chi sono":null,mac:"ss esiste solo su Linux: su macOS usa lsof -iTCP:PORTA -sTCP:LISTEN -n -P oppure netstat -anv -p tcp"};}};
  /* ---- netstat ---- */
  CMDS.netstat={help:"porte e connessioni (vecchio ma presente quasi ovunque)",man:"netstat - print network connections\n\nLinux (net-tools):  netstat -tlnp   (-t TCP, -l in ascolto, -n numeri, -p processo)\nmacOS (BSD):        netstat -anv -p tcp   (-p lì vuol dire protocollo, non processo)\n\nSu Linux recenti può non essere installato: usa ss.",
    run(ctx,args){if(!args.some(a=>/^-[a-z]*l/.test(a)||/^-[a-z]*a/.test(a)))return {out:"(in questa simulazione netstat conosce netstat -tlnp)",code:1};
      const proc=args.some(a=>/^-[a-z]*p/.test(a));
      const row=p=>"tcp".padEnd(9)+"0      0 "+`${p.type==="IPv6"?":::":"0.0.0.0:"}${p.port}`.padEnd(24)+`${p.type==="IPv6"?":::*":"0.0.0.0:*"}`.padEnd(24)+"LISTEN      "+(proc?(ctx.root||p.user===USER?`${p.pid}/${p.cmd}`:"-"):"");
      return {out:"Active Internet connections (only servers)\nProto Recv-Q Send-Q Local Address           Foreign Address         State       PID/Program name\n"+ctx.procs.map(row).join("\n"),code:0,mac:"questa è la forma Linux (net-tools); su macOS -p significa «protocollo»: netstat -anv -p tcp | grep 4173"};}};
  /* ---- kill ---- */
  CMDS.kill={help:"manda un segnale a un processo (di default TERM, che lo chiude)",man:"kill - send a signal to a process\n\nSYNOPSIS\n       kill [-9] pid...\n\nSenza opzioni manda SIGTERM (chiusura gentile); -9 manda SIGKILL (chiusura forzata, il processo non può rifiutare).",
    run(ctx,args){const pids=args.filter(a=>!a.startsWith("-"));if(!pids.length)return {out:"kill: usage: kill [-s sigspec | -n signum | -sigspec] pid | jobspec ... or kill -l [sigspec]",code:2,hint:args.length?null:"kill senza PID: succede quando $(…) ha restituito una stringa vuota, per esempio perché lsof non ha trovato nulla"};
      let out=[],code=0;pids.forEach(s=>{const pid=+s;if(!/^\d+$/.test(s)){out.push(`bash: kill: ${s}: arguments must be process or job IDs`);code=1;return;}const i=ctx.procs.findIndex(p=>p.pid===pid);if(i<0){out.push(`bash: kill: (${pid}) - No such process`);code=1;return;}if(ctx.procs[i].user!==USER&&!ctx.root){out.push(`bash: kill: (${pid}) - Operation not permitted`);code=1;return;}ctx.procs.splice(i,1);});
      return {out:out.join("\n"),code,hint:code?null:"nessun output: kill è silenzioso quando riesce. Controlla con lsof che la porta sia libera."};}};
  CMDS.sudo={help:"esegue un comando come amministratore (root)",run(){return {out:"usage: sudo command",code:1};}};

  /* ---- UI ---- */
  function mkprocs(){return [{cmd:"java",pid:12345,user:"joe",fd:"45u",type:"IPv6",port:8082},{cmd:"node",pid:4021,user:"joe",fd:"22u",type:"IPv4",port:3000},{cmd:"node",pid:7731,user:"joe",fd:"24u",type:"IPv6",port:4173},{cmd:"postgres",pid:812,user:"postgres",fd:"7u",type:"IPv4",port:5432}];}
  function makeTerm(root){const ctx={fs:mkfs(),cwd:root.dataset.cwd||HOME,prev:null,hist:[],clear:false,last:0,procs:mkprocs(),stdin:null,root:false};
    const tries=(root.dataset.try||"").split("§").filter(Boolean);
    root.innerHTML=`<div class="term-bar"><i></i><i></i><i></i><span>bash · simulazione</span></div><div class="term-out" aria-live="polite"></div><div class="term-in"><span class="pr"></span><input type="text" spellcheck="false" autocomplete="off" aria-label="Riga di comando"></div>${tries.length?`<div class="term-try">${tries.map(t=>`<button type="button" data-cmd="${esc(t).replace(/"/g,"&quot;")}">${esc(t)}</button>`).join("")}</div>`:""}`;
    const out=root.querySelector(".term-out"),inp=root.querySelector("input"),prEl=root.querySelector(".term-in .pr");
    const prompt=()=>`${USER}@${HOST}:${ctx.cwd===HOME?"~":ctx.cwd.startsWith(HOME+"/")?"~"+ctx.cwd.slice(HOME.length):ctx.cwd}$`;
    const refresh=()=>{prEl.textContent=prompt()+" ";};
    let hi=0;
    function exec(line){line=line.trim();const pr=prompt();if(line)ctx.hist.push(line);hi=ctx.hist.length;
      const r=runLine(ctx,line);
      if(ctx.clear){out.innerHTML="";ctx.clear=false;}
      else{let h=`<span class="pr">${esc(pr)}</span> <span class="cmd">${esc(line)}</span>\n`;
        if(r.out)h+=r.out+"\n";
        if(r.mac)h+=`<span class="mac">macOS · ${esc(r.mac)}</span>`;
        if(r.hint)h+=`<span class="mac hint">nota · ${esc(r.hint)}</span>`;
        out.insertAdjacentHTML("beforeend",h);out.scrollTop=out.scrollHeight;}
      refresh();}
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){exec(inp.value);inp.value="";}
      else if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;inp.value=ctx.hist[hi]||"";}}
      else if(e.key==="ArrowDown"){e.preventDefault();if(hi<ctx.hist.length){hi++;inp.value=ctx.hist[hi]||"";}}
      else if(e.key==="l"&&e.ctrlKey){e.preventDefault();out.innerHTML="";}
      else if(e.key==="c"&&e.ctrlKey&&!window.getSelection().toString()){e.preventDefault();out.insertAdjacentHTML("beforeend",`<span class="pr">${esc(prompt())}</span> ${esc(inp.value)}^C\n`);inp.value="";}});
    root.querySelectorAll(".term-try button").forEach(b=>b.addEventListener("click",()=>{inp.value=b.dataset.cmd;inp.focus();exec(inp.value);inp.value="";}));
    out.addEventListener("click",()=>{if(!window.getSelection().toString())inp.focus();});
    out.innerHTML=`<span class="dim">Terminale simulato · scrivi un comando e premi Invio · «help» per l'elenco</span>\n`;refresh();}
  document.querySelectorAll("[data-term]").forEach(makeTerm);
  window.TERM_CMDS=CMDS;
})();
</script>
